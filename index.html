<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book an Appointment</title>
  <meta name="description" content="Book your appointment at Zel Salon. No account needed.">
  <meta name="theme-color" content="#1f2328">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Link preview in Messenger / Facebook / Viber: a wide 1200x630 picture (og-image.png). After changing it, have
       Facebook re-read the page: https://developers.facebook.com/tools/debug/ > paste the address > Scrape Again. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zel Salon">
  <meta property="og:url" content="https://zelcorpofficial500.github.io/">
  <meta property="og:title" content="Zel Salon · Book an appointment">
  <meta property="og:description" content="Hair and nails. Book in a minute. No account needed.">
  <meta property="og:image" content="https://zelcorpofficial500.github.io/og-image.png?v=1">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zel Salon: Hair, Nails, Color. Book online.">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; background: #1f2328; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    noscript a { color: #fff; font: 16px Arial, sans-serif; display: block; padding: 24px; }
    /* Installed desktop app with the title bar hidden (Window Controls Overlay): an invisible strip where the title bar
       was, so the window can still be dragged. The app below leaves this strip empty (see ?wco= in the script). */
    #drag { display: none; position: fixed; z-index: 2; top: env(titlebar-area-y, 0); left: env(titlebar-area-x, 0);
      width: env(titlebar-area-width, 100%); height: env(titlebar-area-height, 0); -webkit-app-region: drag; app-region: drag; }
    body.wco #drag { display: block; }
    /* Shown the moment the page opens, while Google loads the booking page behind it (about 3-6 seconds); it fades
       away as soon as the booking page says it is ready (or after 20 seconds). Same photo, logo and words as the page. */
    #splash { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center;
      background: linear-gradient(180deg, rgba(23,20,15,.72), rgba(23,20,15,.6) 45%, rgba(23,20,15,.66)), url('bg.jpg') center / cover no-repeat #17140f;
      color: #fff; font-family: 'Fraunces', Georgia, serif; transition: opacity .35s ease; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { height: 84px; margin: 0 0 28px; }
    #splash .tag { font: italic 13.5px 'Work Sans', Arial, sans-serif; color: #e9e3d6; margin: 0 0 22px; }
    #splash h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 500; line-height: 1.15; margin: 0 0 20px; max-width: 640px; text-shadow: 0 2px 16px rgba(0,0,0,.25); }
    #splash p { font: 17px/1.6 'Work Sans', Arial, sans-serif; color: #efe9dc; max-width: 480px; margin: 0 0 34px; }
    #splash .btn { font: 600 16px 'Work Sans', Arial, sans-serif; background: #e21414; color: #fff; border-radius: 999px; padding: 16px 34px; position: relative; overflow: hidden; }
    #splash .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); animation: sweep 1.4s infinite; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  </style>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!--
    The Zel Salon booking system runs as a Google Apps Script web app. Shown directly, Google adds a
    "This application was created by a Google Apps Script user" bar on top; shown inside this frame, it doesn't.
    Everything after the "?" (e.g. ?page=staff for the staff sign-in, ?ref=ZL-XXXXX from a booking email) is passed
    straight through to the app.
  -->
  <div id="drag"></div>
  <div id="splash" aria-hidden="true"><img src="logo.jpg" alt=""><div class="tag">Where care meets comfort and confidence</div><h1>Great hair. Gorgeous nails. It all starts here.</h1><p>Treatments, straightening, color, and nail services, booked in a few taps. No account needed.</p><div class="btn">Book an Appointment</div></div>
  <iframe id="app" title="Zel Salon" allow="clipboard-write; geolocation; fullscreen; web-share; camera" allowfullscreen></iframe>
  <noscript><a href="https://script.google.com/macros/s/AKfycbwweOuwLx1kf_GAjA0PmO52HwEMm1o3YnHBcGM-L2FwKyNyP3Etpp9FNa5Z_3oDuniOJQ/exec">Open the Zel Salon booking page</a></noscript>
  <script>
    var APP = 'https://script.google.com/macros/s/AKfycbwweOuwLx1kf_GAjA0PmO52HwEMm1o3YnHBcGM-L2FwKyNyP3Etpp9FNa5Z_3oDuniOJQ/exec';
    var params = new URLSearchParams(location.search);
    // The staff sign-in has its own app at its own address (https://zel-salon-staff.web.app): old ?page=staff links and emails go there.
    var toStaff = params.get('page') === 'staff';
    if (toStaff) { params.delete('page'); var rest = params.toString(); location.replace('https://zel-salon-staff.web.app/' + (rest ? '?' + rest : '')); }

    // No "Install app" / "Add to Home screen" pop-up for clients (Chrome on Android shows one because this site is
    // installable). Installing still works from the browser menu, and the installed desktop app is unaffected.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });

    // Opened as the installed app (not a normal browser tab): ?app=1 tells the app to go full screen on the first click.
    var installed = ['standalone', 'window-controls-overlay', 'fullscreen', 'minimal-ui'].some(function (m) {
      return matchMedia('(display-mode: ' + m + ')').matches;
    });

    // When the installed app's title bar is hidden, tell the app how tall the window-button strip is (?wco=<px>) so it
    // moves its content below it. Reloads only when the bar is shown/hidden, not on every window resize, and never while
    // the app is full screen (reloading would throw it out of full screen).
    var overlay = navigator.windowControlsOverlay, frame = document.getElementById('app'), shownHeight = -1;
    function barHeight() { return overlay && overlay.visible ? Math.ceil(overlay.getTitlebarAreaRect().height) : 0; }
    function load() {
      if (toStaff || document.fullscreenElement) return;
      var h = barHeight(), p = new URLSearchParams(location.search);
      if (h === shownHeight) return;
      shownHeight = h;
      p.delete('wco'); p.delete('app');
      if (h) p.set('wco', h);
      if (installed) p.set('app', '1');
      var q = p.toString();
      document.body.classList.toggle('wco', h > 0);
      frame.src = APP + (q ? '?' + q : '');
    }
    load();
    function hideSplash() { var sp = document.getElementById('splash'); if (sp && !sp.classList.contains('gone')) { sp.classList.add('gone'); setTimeout(function () { sp.remove(); }, 400); } }
    setTimeout(hideSplash, 20000);
    // Installed app: the booking page asks for full screen when it's clicked (it's frames deep inside Google's wrapper, so
    // this page does it). Only messages from Google's app frames count, and only in the installed app.
    // The staff dashboard also sends its unseen notification count, shown as "(2) " in front of this tab's title.

    // DTR picture from the dashboard: share it (Messenger etc.) or save it. A page inside a frame usually may not do either,
    // so the dashboard asks this page, and this page says it got it so the dashboard doesn't do it twice.
    function dtrPhoto(e) {
      var d = e.data, data = String(d.data || '');
      if (!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(data) || data.length > 8000000) return;
      try { e.source.postMessage({ zelApp: 'dtrPhotoOk' }, e.origin); } catch (err) { /* frame gone */ }
      var name = String(d.name || 'DTR.jpg').replace(/[^A-Za-z0-9._-]/g, '-').slice(0, 90);
      var b = atob(data.split(',')[1]), a = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
      var blob = new Blob([a], { type: 'image/jpeg' });
      if (d.how === 'share') {
        try {
          var f = new File([blob], name, { type: 'image/jpeg' });
          if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; }
        } catch (err) { /* sharing not available: save it instead */ }
      }
      var url = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
    }
    var baseTitle = document.title;
    window.addEventListener('message', function (e) {
      var host = ''; try { host = new URL(e.origin).hostname; } catch (err) { return; }
      if (!/\.googleusercontent\.com$/.test(host) || !e.data) return;
      if (e.data.zelApp === 'reload') { location.reload(); return; }   // a new version went live: load it
      if (e.data.zelApp === 'ready') { hideSplash(); return; }   // the booking page is on screen: the welcome picture fades away
      if (e.data.zelApp === 'devicesGet') { var dl = []; try { dl = JSON.parse(localStorage.getItem('zelStaffDevices') || '[]'); } catch (err) { dl = []; } try { e.source.postMessage({ zelApp: 'devices', list: Array.isArray(dl) ? dl : [] }, e.origin); } catch (err) { /* frame gone */ } return; }
      if (e.data.zelApp === 'devicesSet') { var ds = Array.isArray(e.data.list) ? e.data.list.slice(0, 10) : []; try { var js = JSON.stringify(ds); if (js.length < 600000) { if (ds.length) localStorage.setItem('zelStaffDevices', js); else localStorage.removeItem('zelStaffDevices'); } } catch (err) { /* storage full or blocked */ } return; }   // saved accounts (see the dashboard)
      if (e.data.zelApp === 'dtrPhoto') { dtrPhoto(e); return; }   // DTR picture: share or save
      if (e.data.zelApp === 'badge') {
        var n = parseInt(e.data.count, 10) || 0;
        document.title = (n > 0 ? '(' + (n > 99 ? '99+' : n) + ') ' : '') + (e.data.title ? String(e.data.title).slice(0, 60) : baseTitle);
        return;
      }
      if (!installed) return;
      if (e.data.zelApp === 'fullscreen' && document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () { /* refused: stay windowed */ });
      }
    });

    // settle first: leaving full screen can briefly report the bar as hidden, which must not reload the app
    var settle = null;
    if (overlay) overlay.addEventListener('geometrychange', function () { clearTimeout(settle); settle = setTimeout(load, 600); });
  </script>
</body>
</html>
